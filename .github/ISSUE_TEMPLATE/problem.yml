name: Problem report
description: Tell us that the addon does not work as it should.
title: "Problem: "
labels: ["problem"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. The link from `/totg report` in the game fills this form. Click the green button to send it.
        The report has no character name and no realm.
  - type: textarea
    id: what
    attributes:
      label: What is wrong?
      description: One or two sentences are sufficient.
      placeholder: "Example: the icon never starts a countdown."
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: The report from /totg report
      description: The link from the game fills this field.
      render: text
    validations:
      required: true
