# Packages the addon and uploads it to CurseForge and GitHub Releases when a
# tag such as v0.1.0 is pushed. The packager reads X-Curse-Project-ID from the
# TOC, and maps "## Interface: 16001" to the CurseForge game version 1.60.1
# (World of Warcraft: Forever, flavor "Forever").
#
# Before the first tag:
#   1. Create the CurseForge project and put its ID in TouchOfTheGrave.toc.
#   2. Add the repository secret CF_API_KEY (a CurseForge API token).
name: Release addon

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
        with:
          args: -g 1.60.1
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
